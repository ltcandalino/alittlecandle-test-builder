# ALittleCandleTestBuilder with automatic HTTPS (Caddy).
# 1. Change the two ADMIN_ lines below.
# 2. Put your web address in Caddyfile.
# 3. Run:  docker compose up -d --build
#    (or use the ready-made image from GitHub; see the app: section below)
services:
  app:
    build: .
    image: alittlecandle-testbuilder
    # Once the repo is on GitHub, you can use the image GitHub builds instead of building here:
    # delete the two lines above, uncomment the next line (with your GitHub name and repo),
    # and update with:  docker compose pull && docker compose up -d
    # image: ghcr.io/YOUR-GITHUB-NAME/alittlecandle-test-builder:latest
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: you@yourschool.org        # your sign-in email
      ADMIN_PASSWORD: change-this-password   # 8+ characters; only used the very first time
      # ADMIN_RESET: "1"                     # locked out? uncomment, set a new ADMIN_PASSWORD, restart, then comment out again
    volumes:
      - alctb-data:/data                     # accounts, banks and pictures live here

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  alctb-data:
  caddy-data:
  caddy-config:
