# ALittleCandleTestBuilder with automatic HTTPS (Caddy).
# 1. Change the two ADMIN_ lines below.
# 2. Put your web address in Caddyfile.
# 3. Run:     docker compose up -d
#    Update:  docker compose pull && docker compose up -d
services:
  app:
    # The ready-made image GitHub builds and scans. ":latest" is the newest release; to stay on one
    # version, use its number instead, like ":0.7" (fixes only) or ":0.7.0" (exactly that version).
    image: ghcr.io/ltcandalino/alittlecandle-test-builder:latest
    # To build the image yourself from the files in this folder instead, delete the image: line above
    # and put "build: ." in its place. Don't keep both: with build: present, Docker builds from this
    # folder's files and ignores the version in image:.
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: you@yourschool.org        # your sign-in email
      ADMIN_PASSWORD: change-this-password   # 8+ characters; only used the very first time
      # ADMIN_RESET: "1"                     # locked out? uncomment, set a new ADMIN_PASSWORD, restart, then comment out again
      # DATABASE_URL: postgres://user:password@host:5432/alctb   # PostgreSQL / MySQL / MariaDB instead of SQLite;
      #                                     # or use compose.postgres.yml / compose.mariadb.yml (see README.md)
    volumes:
      - alctb-data:/data                     # accounts, banks and pictures live here

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  alctb-data:
  caddy-data:
  caddy-config:
