# Builds the Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest      newest version on the main branch
#   ghcr.io/<owner>/<repo>:1.2.3       when you push a tag like v1.2.3
#   ghcr.io/<owner>/<repo>:sha-abc1234 every build
# Pull requests are built and tested but not published.
name: Docker image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the app pages from src/
        run: python3 build.py

      - name: Warn if the committed pages are out of date
        run: |
          if ! git diff --quiet -- ALittleCandleTestBuilder.html docker/index.html; then
            echo "::warning::ALittleCandleTestBuilder.html or docker/index.html didn't match src/. Run python3 build.py and commit. (The image uses the fresh build either way.)"
          fi

      - name: Smoke test the server
        run: |
          docker build -t alctb-test docker
          docker run -d --name alctb -p 8080:8080 \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-test-password alctb-test
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q ALittleCandleTestBuilder
          curl -fsS http://127.0.0.1:8080/config.js | grep -q selfHosted
          docker logs alctb
          docker rm -f alctb

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
