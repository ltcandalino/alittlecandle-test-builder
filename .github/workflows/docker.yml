# CI: runs the full test suite, then builds the Docker image and publishes it to GitHub Container Registry.
#   ghcr.io/<owner>/<repo>:latest            newest version on the main branch
#   ghcr.io/<owner>/<repo>:edge              same as latest (main branch builds)
#   ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1   when you push a tag like v1.2.3 (":1" only from 1.0.0 on)
#   ghcr.io/<owner>/<repo>:sha-abc1234       every published build
# Pull requests are tested and built but not published.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the version number
        run: |
          v=$(cat VERSION)
          echo "VERSION file: $v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::VERSION must be semantic, like 1.2.3"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION $v"; exit 1; }
            python3 scripts/release-notes.py "$v" >/dev/null || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          fi
      - name: Warn if the committed pages are out of date
        run: |
          python3 build.py
          if ! git diff --quiet -- ALittleCandleTestBuilder.html docker/index.html; then
            echo "::warning::ALittleCandleTestBuilder.html or docker/index.html didn't match src/. Run python3 build.py and commit."
          fi
      - name: Run all tests
        run: npm test
      - name: Keep the test PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/out/
          retention-days: 14

  databases:
    name: database (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:18
            url: postgres://postgres:test-pass-1@127.0.0.1:5432/postgres
            port: '5432:5432'
            env: '{"POSTGRES_PASSWORD":"test-pass-1"}'
            health: pg_isready -U postgres
          - db: mariadb
            image: mariadb:lts
            url: mariadb://root:test-pass-1@127.0.0.1:3306/mysql
            port: '3306:3306'
            env: '{"MARIADB_ROOT_PASSWORD":"test-pass-1"}'
            health: healthcheck.sh --connect --innodb_initialized
          - db: mysql
            image: mysql:lts
            url: mysql://root:test-pass-1@127.0.0.1:3306/mysql
            port: '3306:3306'
            env: '{"MYSQL_ROOT_PASSWORD":"test-pass-1"}'
            health: mysqladmin ping -h 127.0.0.1 -uroot -ptest-pass-1
    services:
      db:
        image: ${{ matrix.image }}
        env: ${{ fromJSON(matrix.env) }}
        ports: ['${{ matrix.port }}']
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 3s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install test tools and database drivers
        run: |
          npm install --no-audit --no-fund
          npm install --prefix docker --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 build.py
      - name: Server and sync tests on ${{ matrix.db }}
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
        run: node --test --test-concurrency=1 tests/server.test.cjs tests/sync.test.cjs

  image:
    needs: [test, databases]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build the app pages from src/
        run: |
          python3 build.py
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Smoke test the image
        run: |
          docker build --build-arg APP_VERSION="$APP_VERSION" -t alctb-test docker
          docker run -d --name alctb -p 8080:8080 \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-test-password alctb-test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "\"version\":\"$APP_VERSION\""
          curl -fsS http://127.0.0.1:8080/ | grep -q ALittleCandleTestBuilder
          curl -fsS http://127.0.0.1:8080/config.js | grep -q selfHosted
          curl -fsS -X POST 'http://127.0.0.1:8080/auth/v1/token?grant_type=password' \
            -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci-test-password"}' | grep -q access_token
          docker logs alctb
          docker rm -f alctb

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=ALittleCandleTestBuilder
            org.opencontainers.image.version=${{ env.APP_VERSION }}

      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
