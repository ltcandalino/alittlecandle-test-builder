# Copies the wiki/ folder to the repository's GitHub wiki whenever it changes on the main branch.
# One-time setup on GitHub: Settings → Features → tick Wikis, then open the Wiki tab and
# create any first page (GitHub only makes the wiki's storage after the first page exists).
name: Wiki

on:
  push:
    branches: [main, master]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"
          if ! git clone --depth 1 "$url" wiki-repo; then
            echo "::error::The wiki isn't set up yet. On GitHub, open the Wiki tab, create any first page, then re-run this workflow."
            exit 1
          fi
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude README.md wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Update wiki from ${SHA::7}"
            git push
          fi
