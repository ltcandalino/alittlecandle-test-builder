name: Feature request
description: An idea that would make building, printing or sharing tests easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the button. Why is it hard today?
      placeholder: "Before each unit I make three versions of a quiz and it takes me 20 minutes to …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, if you have one. A sketch or an example from another program is welcome.
  - type: dropdown
    id: where
    attributes:
      label: Where in the app?
      multiple: true
      options:
        - Question bank
        - 1 Pick questions
        - 2 Arrange
        - 3 Format
        - 4 Print
        - Import & backup
        - Manage accounts (website admin)
        - Sharing / team banks (website)
        - Not sure / somewhere new
  - type: dropdown
    id: docs
    attributes:
      label: Which documents or downloads? (if it's about what prints)
      multiple: true
      options:
        - Test
        - Quiz
        - Review
        - Lesson
        - Answer keys
        - Accommodated copy
        - Printing
        - Word download
        - LaTeX download
        - All of them
  - type: textarea
    id: done
    attributes:
      label: Done when…
      description: How will you check that it works? Be concrete.
      placeholder: "All four document types print with ½-inch margins, and the Review table has no lines."
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example to test with
      description: A real question, bank or file name, or a screenshot. Don't attach private or purchased questions here (this page is public); say where they are instead.
  - type: textarea
    id: keep
    attributes:
      label: Leave alone
      description: Anything that should NOT change.
      placeholder: "Keep the purple shading on the Multiple Choice heading."
  - type: dropdown
    id: who
    attributes:
      label: Who would use it?
      options:
        - Just me
        - My department / colleagues
        - Students (on the printed test)
        - Whoever runs the website
  - type: dropdown
    id: urgency
    attributes:
      label: How much would it help?
      options:
        - Nice to have
        - It would save me real time
        - I can't do my work without it
