# Weekly pull requests when newer versions are out: GitHub Actions, the Docker base image (Node),
# the test tools in package.json, and the server's database drivers in docker/package.json. pdf.js in vendor/pdfjs/ is copied by hand (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /docker
    schedule: { interval: weekly }
